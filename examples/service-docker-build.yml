# Example: place in a service repository as .github/workflows/docker-build.yml
name: Docker build

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    # Pin to a release tag (or a full commit SHA); never to a moving branch.
    uses: House-Hold-Hub/Automation/.github/workflows/docker-build.yml@v1
    with:
      dockerfile: Dockerfile        # service-owned
      context: .                    # service-owned
      image-name: backend
      # target: runtime
      # build-args: |
      #   APP_ENV=ci
