name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-build:
    name: Smoke test reusable docker-build
    uses: ./.github/workflows/docker-build.yml
    with:
      dockerfile: tests/fixtures/smoke/Dockerfile
      context: tests/fixtures/smoke
      image-name: automation-smoke
      build-args: |
        GREETING=smoke

  branch-protection-script:
    name: Test set-required-checks script
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Regression tests (stubbed gh, no network)
        run: tests/scripts/set-required-checks.test.sh
