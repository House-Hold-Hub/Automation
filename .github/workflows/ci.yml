name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  smoke-build:
    name: Smoke test reusable docker-build
    uses: ./.github/workflows/docker-build.yml
    with:
      dockerfile: tests/fixtures/smoke/Dockerfile
      context: tests/fixtures/smoke
      image-name: automation-smoke
      build-args: |
        GREETING=smoke
