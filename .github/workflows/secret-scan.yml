name: Secret scanning

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: Scan pull-request commits for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Require pull-request context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "::error::Secret scanning must be called from a pull_request workflow."
            exit 1
          fi

      - name: Check out calling repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject pull-request scanner policy changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Pull-request base/head SHA is unavailable or invalid."
            exit 1
          fi

          set +e
          git diff --quiet --no-ext-diff --no-textconv \
            "$BASE_SHA" "$HEAD_SHA" -- \
            .gitleaks.toml .gitleaksignore
          diff_status=$?
          set -e

          case "$diff_status" in
            0)
              ;;
            1)
              echo "::error::Pull requests must not modify .gitleaks.toml or .gitleaksignore."
              exit 1
              ;;
            *)
              echo "::error::Unable to verify that Gitleaks policy files are unchanged."
              exit 1
              ;;
          esac

      - name: Install Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          bin_dir="$RUNNER_TEMP/gitleaks-bin"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$archive_path"
          echo "${GITLEAKS_SHA256}  ${archive_path}" | sha256sum --check --strict -
          mkdir -p "$bin_dir"
          tar -xzf "$archive_path" -C "$bin_dir" gitleaks
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Scan pull-request commit range
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Pull-request base/head SHA is unavailable or invalid."
            exit 1
          fi
          gitleaks git \
            --no-banner \
            --redact \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            .
