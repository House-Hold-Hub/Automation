name: Secret scan (reusable)

# Shared secret-scanning gate (ADR-009: Automation owns secret scanning; security-model.md).
# It is a blocking CI check that scans the commits a pull request adds (or the full history on
# other events). It is separate from GitHub's native secret scanning and push protection, which
# are repository settings and cannot be made a required status check.
# Findings are redacted in the log. The scanner runs from an image pinned by digest, with the
# repository mounted read-only and no token or secret passed to the container.

on:
  workflow_call:
    inputs:
      mode:
        description: >-
          history scans git commits (pull request: only the commits it adds; other events: the whole
          history). tree scans the checked-out files only and is meant for fixtures and self-tests.
        type: string
        default: history
      config-path:
        description: Gitleaks configuration relative to the repository root. Empty uses .gitleaks.toml when present, else the built-in rules.
        type: string
        default: ""
      path:
        description: Directory to scan in tree mode, relative to the repository root.
        type: string
        default: .
      ref:
        description: Git ref to scan. Defaults to the ref that triggered the caller.
        type: string
        default: ""
      report-only:
        description: Report the result through the `outcome` output without failing the job. For adoption and self-tests only; a blocking gate leaves this false.
        type: boolean
        default: false
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Job timeout.
        type: number
        default: 10
    outputs:
      outcome:
        description: success or failure of the scan (meaningful with report-only).
        value: ${{ jobs.scan.outputs.outcome }}

permissions: {}

jobs:
  scan:
    name: scan
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      outcome: ${{ steps.gitleaks.outcome }}
    steps:
      - name: Check out caller repository with history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Scan with Gitleaks
        id: gitleaks
        continue-on-error: ${{ inputs.report-only }}
        env:
          MODE: ${{ inputs.mode }}
          CONFIG: ${{ inputs.config-path }}
          SCAN_PATH: ${{ inputs.path }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          # gitleaks v8.30.1
          image=ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f
          args=(--redact --verbose --no-banner)
          if [ -n "$CONFIG" ]; then
            args+=(--config "/repo/$CONFIG")
          fi
          case "$MODE" in
            history)
              if [ "$EVENT_NAME" = "pull_request" ] || [ "$EVENT_NAME" = "pull_request_target" ]; then
                args+=(--log-opts "$PR_BASE_SHA..$PR_HEAD_SHA")
              fi
              sub=(git /repo)
              ;;
            tree)
              sub=(dir "/repo/$SCAN_PATH")
              ;;
            *)
              echo "::error::Unknown mode '$MODE' (expected history or tree)."
              exit 2
              ;;
          esac
          docker run --rm -v "$PWD:/repo:ro" \
            -e GIT_CONFIG_COUNT=1 -e GIT_CONFIG_KEY_0=safe.directory -e GIT_CONFIG_VALUE_0=/repo \
            "$image" "${sub[@]}" "${args[@]}"
