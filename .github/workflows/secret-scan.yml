name: Secret scanning

on:
  workflow_call:

permissions:
  contents: read

jobs:
  scan:
    name: Scan pull-request commits for secrets
    runs-on: ubuntu-latest
    steps:
      - name: Require pull-request context
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != "pull_request" ]]; then
            echo "::error::Secret scanning must be called from a pull_request workflow."
            exit 1
          fi

      - name: Check out calling repository history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Reject pull-request scanner policy changes
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Pull-request base/head SHA is unavailable or invalid."
            exit 1
          fi

          if ! merge_base="$(git merge-base "$BASE_SHA" "$HEAD_SHA")"; then
            echo "::error::Unable to determine the pull-request merge base."
            exit 1
          fi
          if [[ ! "$merge_base" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Pull-request merge base is unavailable or invalid."
            exit 1
          fi

          policy_paths_path="$RUNNER_TEMP/gitleaks-policy-paths"
          if ! python3 - "$BASE_SHA" "$policy_paths_path" <<'PY'
          import posixpath
          import subprocess
          import sys
          import tomllib
          from pathlib import Path

          trusted_base, output_path = sys.argv[1:3]
          max_extend_depth = 2

          def git(*args: str) -> bytes:
              result = subprocess.run(
                  ["git", *args],
                  check=False,
                  stdout=subprocess.PIPE,
                  stderr=subprocess.PIPE,
              )
              if result.returncode != 0:
                  message = result.stderr.decode("utf-8", errors="replace").strip()
                  raise RuntimeError(message or f"git {' '.join(args)} failed")
              return result.stdout

          def blob_exists(path: str) -> bool:
              return bool(git("ls-tree", "-z", "--name-only", trusted_base, "--", path))

          def read_config(path: str) -> dict:
              if not blob_exists(path):
                  raise RuntimeError(f"trusted Gitleaks config {path!r} does not exist")
              try:
                  raw = git("show", f"{trusted_base}:{path}").decode("utf-8")
              except UnicodeDecodeError as exc:
                  raise RuntimeError(f"trusted Gitleaks config {path!r} is not UTF-8") from exc
              try:
                  return tomllib.loads(raw)
              except tomllib.TOMLDecodeError as exc:
                  raise RuntimeError(f"cannot parse trusted Gitleaks config {path!r}: {exc}") from exc

          def normalize_extend_path(value: object) -> str | None:
              if value is None or value == "":
                  return None
              if not isinstance(value, str):
                  raise RuntimeError("[extend].path must be a string")
              normalized = posixpath.normpath(value)
              if (
                  normalized in ("", ".")
                  or normalized.startswith("/")
                  or normalized == ".."
                  or normalized.startswith("../")
              ):
                  raise RuntimeError(f"unsafe [extend].path {value!r}")
              return normalized

          protected_paths = [".gitleaks.toml", ".gitleaksignore"]
          if blob_exists(".gitleaks.toml"):
              current_path = ".gitleaks.toml"
              seen = {current_path}
              depth = 0
              while True:
                  config = read_config(current_path)
                  extend = config.get("extend", {})
                  if not isinstance(extend, dict):
                      raise RuntimeError("[extend] must be a TOML table")
                  next_path = normalize_extend_path(extend.get("path"))
                  if next_path is None:
                      break
                  depth += 1
                  if depth > max_extend_depth:
                      raise RuntimeError("Gitleaks [extend].path chain exceeds supported depth")
                  if next_path in seen:
                      raise RuntimeError("Gitleaks [extend].path chain contains a cycle")
                  if not blob_exists(next_path):
                      raise RuntimeError(
                          f"trusted extended Gitleaks config {next_path!r} does not exist"
                      )
                  protected_paths.append(next_path)
                  seen.add(next_path)
                  current_path = next_path

          Path(output_path).write_bytes(
              b"".join(path.encode("utf-8") + b"\0" for path in protected_paths)
          )
          PY
          then
            echo "::error::Unable to resolve trusted Gitleaks policy dependencies."
            exit 1
          fi

          policy_paths=()
          while IFS= read -r -d '' policy_path; do
            policy_paths+=("$policy_path")
          done < "$policy_paths_path"
          if (( ${#policy_paths[@]} < 2 )); then
            echo "::error::Trusted Gitleaks policy path resolution returned an invalid result."
            exit 1
          fi

          set +e
          git diff --quiet --no-ext-diff --no-textconv \
            "$merge_base" "$HEAD_SHA" -- "${policy_paths[@]}"
          diff_status=$?
          set -e

          case "$diff_status" in
            0)
              ;;
            1)
              echo "::error::Pull requests must not modify Gitleaks policy files or trusted [extend].path dependencies."
              exit 1
              ;;
            *)
              echo "::error::Unable to verify that trusted Gitleaks policy files are unchanged."
              exit 1
              ;;
          esac

          commits_path="$RUNNER_TEMP/gitleaks-pr-commits.txt"
          diff_path="$RUNNER_TEMP/gitleaks-commit.diff"
          added_lines_path="$RUNNER_TEMP/gitleaks-added-lines.txt"

          if ! git rev-list --reverse "$merge_base..$HEAD_SHA" > "$commits_path"; then
            echo "::error::Unable to enumerate pull-request commits for Gitleaks suppressions."
            exit 1
          fi

          while IFS= read -r commit_sha; do
            [[ -n "$commit_sha" ]] || continue

            if ! parent_sha="$(git rev-parse "${commit_sha}^1")"; then
              echo "::error::Unable to resolve parent for pull-request commit ${commit_sha}."
              exit 1
            fi

            if ! git diff --no-ext-diff --no-textconv --text --unified=0 \
              "$parent_sha" "$commit_sha" -- . > "$diff_path"; then
              echo "::error::Unable to inspect pull-request commit ${commit_sha} for Gitleaks suppressions."
              exit 1
            fi

            if ! awk '
              /^diff --git / { in_hunk = 0; next }
              /^@@ / { in_hunk = 1; next }
              in_hunk && /^\+/ { print substr($0, 2) }
            ' "$diff_path" > "$added_lines_path"; then
              echo "::error::Unable to inspect added lines in pull-request commit ${commit_sha}."
              exit 1
            fi

            set +e
            grep -Fq 'gitleaks:allow' "$added_lines_path"
            grep_status=$?
            set -e

            case "$grep_status" in
              0)
                echo "::error::Pull requests must not introduce gitleaks:allow suppressions (commit ${commit_sha})."
                exit 1
                ;;
              1)
                ;;
              *)
                echo "::error::Unable to verify added lines in pull-request commit ${commit_sha}."
                exit 1
                ;;
            esac
          done < "$commits_path"

      - name: Install Gitleaks
        shell: bash
        env:
          GITLEAKS_VERSION: 8.30.1
          GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -euo pipefail
          archive="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          archive_path="$RUNNER_TEMP/$archive"
          bin_dir="$RUNNER_TEMP/gitleaks-bin"
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}" \
            --output "$archive_path"
          echo "${GITLEAKS_SHA256}  ${archive_path}" | sha256sum --check --strict -
          mkdir -p "$bin_dir"
          tar -xzf "$archive_path" -C "$bin_dir" gitleaks
          echo "$bin_dir" >> "$GITHUB_PATH"

      - name: Scan pull-request commit range
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          if [[ ! "$BASE_SHA" =~ ^[0-9a-f]{40}$ ]] || [[ ! "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::Pull-request base/head SHA is unavailable or invalid."
            exit 1
          fi
          gitleaks git \
            --no-banner \
            --redact \
            --log-opts="${BASE_SHA}..${HEAD_SHA} --diff-merges=separate --text" \
            .
