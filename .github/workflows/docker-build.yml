name: Docker build (reusable)

# Shared build logic only. Dockerfile, build context and the calling workflow
# are owned by the service repository. This workflow never pushes an image,
# logs in to a registry or deploys: the target is deferred (D02).

on:
  workflow_call:
    inputs:
      dockerfile:
        description: Path to the Dockerfile, relative to the checked-out repository root.
        type: string
        default: Dockerfile
      context:
        description: Docker build context, relative to the repository root.
        type: string
        default: .
      image-name:
        description: Local image name (no registry host) used to tag the build.
        type: string
        default: service
      image-tag:
        description: Local image tag.
        type: string
        default: ci
      target:
        description: Optional multi-stage build target.
        type: string
        default: ""
      build-args:
        description: Newline-separated KEY=VALUE build arguments. Do not pass secrets.
        type: string
        default: ""
      ref:
        description: Git ref to build. Defaults to the ref that triggered the caller.
        type: string
        default: ""
      runs-on:
        description: Runner label.
        type: string
        default: ubuntu-latest
      timeout-minutes:
        description: Job timeout.
        type: number
        default: 30
    outputs:
      image:
        description: Local image reference that was built (name:tag).
        value: ${{ jobs.build.outputs.image }}

permissions: {}

jobs:
  build:
    runs-on: ${{ inputs.runs-on }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read
    outputs:
      image: ${{ steps.build.outputs.image }}
    steps:
      - name: Check out caller repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false

      - name: Build image
        id: build
        env:
          DOCKERFILE: ${{ inputs.dockerfile }}
          CONTEXT: ${{ inputs.context }}
          IMAGE: ${{ inputs.image-name }}:${{ inputs.image-tag }}
          TARGET: ${{ inputs.target }}
          BUILD_ARGS: ${{ inputs.build-args }}
        run: |
          set -euo pipefail
          args=(--file "$DOCKERFILE" --tag "$IMAGE")
          if [ -n "$TARGET" ]; then
            args+=(--target "$TARGET")
          fi
          while IFS= read -r line || [ -n "$line" ]; do
            [ -z "$line" ] && continue
            args+=(--build-arg "$line")
          done <<< "$BUILD_ARGS"
          docker build "${args[@]}" "$CONTEXT"
          echo "image=$IMAGE" >> "$GITHUB_OUTPUT"
