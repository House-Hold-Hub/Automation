name: Validate canonical OpenAPI contract

on:
  workflow_call:
    inputs:
      documentation_ref:
        description: Reviewed House-Hold-Hub/Documentation commit SHA or tag.
        required: true
        type: string

permissions:
  contents: read

jobs:
  validate:
    name: Validate canonical OpenAPI
    runs-on: ubuntu-latest
    steps:
      - name: Check out canonical Documentation contract
        uses: actions/checkout@v7
        with:
          repository: House-Hold-Hub/Documentation
          ref: ${{ inputs.documentation_ref }}
          path: documentation
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Validate syntax and references
        run: npx --yes @redocly/cli@2.54.3 bundle documentation/api/openapi.yaml --output /tmp/openapi-bundled.yaml

      - name: Lint canonical contract
        run: npx --yes @redocly/cli@2.54.3 lint documentation/api/openapi.yaml --config documentation/redocly.yaml
